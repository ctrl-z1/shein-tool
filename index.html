<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEIN Link Converter</title>
    <style>
        :root { --primary: #000; --accent: #ff4757; --bg: #f4f4f9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #555; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.3s; margin-bottom: 10px; }
        .btn-generate { background: var(--primary); color: white; }
        .btn-copy { background: #2f3542; color: white; display: none; }
        button:active { transform: scale(0.98); }
        #result-container { margin-top: 20px; display: none; background: #eef2f3; padding: 15px; border-radius: 10px; word-break: break-all; font-size: 0.85rem; border: 1px dashed #ccc; }
        .success-badge { color: #2ed573; font-weight: bold; text-align: center; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>SHEIN Affiliate Tool</h2>
    
    <div class="input-group">
        <label>Paste SHEIN Product Link:</label>
        <input type="text" id="productLink" placeholder="https://ph.shein.com/...">
    </div>

    <button class="btn-generate" onclick="convertLink()">Generate Affiliate Link</button>
    
    <div id="success" class="success-badge">Link Generated!</div>
    
    <div id="result-container">
        <span id="resultLink"></span>
    </div>

    <button id="copyBtn" class="btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
</div>

<script>
    const MY_AFFILIATE_ID = "4134890505";

    function convertLink() {
        const input = document.getElementById('productLink').value.trim();
        if (!input) return alert("Please paste a link first!");

        const baseUrl = input.split('?')[0];
        const affiliateLink = `${baseUrl}?aff_id=${MY_AFFILIATE_ID}&utm_source=affiliate&utm_medium=cpa&settlement_id=${MY_AFFILIATE_ID}`;

        document.getElementById('resultLink').innerText = affiliateLink;
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        document.getElementById('success').style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('resultLink').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIED!";
            btn.style.background = "#2ed573";
            setTimeout(() => {
                btn.innerText = "Copy to Clipboard";
                btn.style.background = "#2f3542";
            }, 2000);
        });
    }
</script>

</body>
</html>
